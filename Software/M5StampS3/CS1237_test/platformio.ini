[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps = 
	fastled/FastLED@^3.7.6
	bblanchon/ArduinoJson@^7.1.0
	tremaru/iarduino_ADC_CS1237@^1.0.4
