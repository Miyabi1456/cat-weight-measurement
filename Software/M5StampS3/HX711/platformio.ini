[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps = 
	fastled/FastLED@^3.7.6
	olkal/HX711_ADC@^1.2.12
	bblanchon/ArduinoJson@^7.1.0
